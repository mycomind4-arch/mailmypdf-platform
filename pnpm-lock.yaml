  packages/ecosystem:
    dependencies:
      '@mailmypdf/core':
        specifier: workspace:*
        version: link:../core

  packages/evidence: {}

  packages/fulfillment:
    dependencies:
      '@mailmypdf/core':
        specifier: workspace:*
        version: link:../core

  packages/intelligence:
    dependencies:
      '@mailmypdf/core':
        specifier: workspace:*
        version: link:../core
      '@mailmypdf/documents':
        specifier: workspace:*
        version: link:../documents

  packages/proof:
    dependencies:
      '@mailmypdf/core':
        specifier: workspace:*
        version: link:../core

  packages/redaction: {}
  packages/search: {}
  packages/vertical-factory: {}
  packages/voice:
