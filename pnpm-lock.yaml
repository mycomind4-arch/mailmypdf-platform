lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      '@types/node':
        specifier: ^26.2.0
        version: 26.2.0
      typescript:
        specifier: ^5.8.3
        version: 5.9.3

  packages/ai:
    dependencies:
      '@mailmypdf/core':
        specifier: workspace:*
        version: link:../core

  packages/agent-runtime: {}
  packages/accessibility: {}
  packages/capabilities: {}
  packages/core: {}
  packages/design-system: {}

  packages/document-intelligence:
